<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="only light">
  <title>备战大厅 · 喵喵碰碰大作战</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="preparation.css?v=rival-reroll-1">
  <link rel="stylesheet" href="roster-picker.css?v=numbered-toggle-1">
  <link rel="stylesheet" href="map-picker.css?v=1">
  <script defer src="maps.js?v=formation-1"></script>
  <script defer src="motion.js?v=juzi-opening-2"></script>
  <script defer src="battle.js?v=random-rival-1"></script>
  <script defer src="art.js?v=yui-roster-1"></script>
  <script defer src="i18n.js?v=roster-1"></script>
  <script defer src="map-picker.js?v=player-ui-1"></script>
  <script defer src="assets/characters/roster-preview/player.js?v=roster-1"></script>
  <script defer src="preparation.js?v=rival-reroll-1"></script>
</head>
<body>
  <main class="lobby">
    <header class="lobby-header">
      <div class="lobby-logo"><img src="assets/ui/concept-title-zh-v2.png" alt="喵喵碰碰大作战"></div>
      <h1>备战大厅</h1>
    </header>
    <section class="lobby-card" aria-label="赛前阵容">
      <div class="arena">
        <div class="arena-header">
          <h2 class="team-label ally-label"><img src="assets/ui/icons/fa-solid/paw.svg" alt="">我方阵容</h2>
          <div class="map-label"><span>当前地图</span><strong id="current-map-name">夏日水池</strong></div>
          <div class="rival-header">
            <h2 class="team-label rival-label"><img src="assets/ui/icons/fa-solid/paw.svg" alt=""><span>林悠怡<small>对手</small></span></h2>
            <button id="reroll-rival" class="reroll-rival" type="button" aria-controls="rival-lineup" disabled>换一组对手</button>
          </div>
        </div>
        <div class="team lineup-ally" id="ally-lineup" role="group" aria-label="我方出战位"></div>
        <div class="team lineup-rival" id="rival-lineup" role="group" aria-label="对方阵容" aria-live="polite" aria-atomic="true"></div>
      </div>
      <footer class="lobby-controls">
        <div class="team-status">
          <div class="progress-line"><strong id="roster-count">已选 0/3</strong><span class="roster-pips" id="roster-pips" aria-hidden="true"><i></i><i></i><i></i></span></div>
          <p id="lobby-hint" aria-live="polite">点击带「＋」的泳圈，选择出战猫猫</p>
        </div>
        <div class="lobby-actions">
          <button id="choose-map" class="choose-map" type="button" aria-haspopup="dialog" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/></svg>
            选择地图
          </button>
          <button id="start-match" class="start-match" type="button" disabled><img src="assets/ui/icons/fa-solid/paw.svg" alt="">开始对战</button>
        </div>
      </footer>
    </section>
  </main>
  <dialog class="roster-picker" id="roster-picker" aria-labelledby="picker-title">
    <button id="picker-back" class="picker-back" type="button">返回备战</button>
    <div class="picker-body">
      <section class="picker-library" aria-labelledby="picker-title">
        <h2 id="picker-title">猫猫列表</h2>
        <div class="picker-cats" id="picker-cats" role="group" aria-labelledby="picker-title"></div>
      </section>
      <section class="picker-stage" aria-labelledby="picker-cat-name">
        <div class="picker-picture"><canvas id="roster-preview" width="320" height="200" aria-hidden="true"></canvas></div>
        <div class="picker-details">
          <h3 id="picker-cat-name"></h3>
          <dl class="picker-stats"><div><dt>生命</dt><dd id="picker-hp"></dd></div><div><dt>攻击</dt><dd id="picker-attack"></dd></div></dl>
          <div class="picker-skill"><span class="picker-skill-title">角色特性</span><div class="picker-skill-copy"><strong id="picker-skill"></strong><p id="picker-brief"></p></div></div>
        </div>
        <div class="picker-confirmation"><p id="picker-count" aria-live="polite"></p><button id="picker-confirm" type="button" aria-describedby="picker-count" disabled>确定阵容</button></div>
      </section>
    </div>
  </dialog>
  <dialog class="map-picker" id="map-picker" aria-labelledby="map-picker-title">
    <header class="map-picker-header">
      <h2 id="map-picker-title">选择地图</h2>
      <button id="map-picker-back" type="button">返回备战</button>
    </header>
    <div class="map-picker-body">
      <section class="map-library" aria-labelledby="map-library-title">
        <h3 id="map-library-title">地图列表</h3>
        <ul class="map-choices" id="map-choices"></ul>
      </section>
      <section class="map-details" aria-labelledby="map-preview-name">
        <div class="map-preview-heading">
          <div><h3 id="map-preview-name"></h3><p id="map-preview-info"></p></div>
          <ul class="map-legend" aria-label="出生点图例">
            <li><i class="map-team-ally"></i>我方出生点</li>
            <li><i class="map-team-rival"></i>对手出生点</li>
          </ul>
        </div>
        <div class="map-geometry" id="map-geometry" role="group" aria-label="地图俯视图与出生点">
          <canvas id="map-preview" aria-hidden="true"></canvas>
          <div id="map-markers" class="map-markers"></div>
        </div>
        <p class="map-preview-tip">数字对应备战大厅的出战站位。</p>
      </section>
    </div>
    <footer class="map-picker-footer"><button id="map-picker-confirm" type="button">确认地图</button></footer>
  </dialog>
  <template id="slot-template">
    <canvas class="slot-art" aria-hidden="true" width="100" height="110"></canvas>
    <span class="slot-plus" aria-hidden="true">+</span>
    <span class="slot-tag"><span class="slot-number"></span><span class="slot-name"></span></span>
  </template>
</body>
</html>
