<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Preserve the game artwork: opt this document out of automatic recolouring. -->
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meow Meow Bump Battle</title>
  <link rel="icon" href="data:,">
  <script>
    if (/\/plugin\/miao_miao_bump\/ui$/.test(location.pathname)) {
      const base = document.createElement('base');
      base.href = location.pathname + '/';
      document.head.append(base);
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skin.css?v=entry-finish-1">
  <link rel="stylesheet" href="layout.css?v=contact-1">
  <link rel="stylesheet" href="versus.css?v=4">
  <link rel="stylesheet" href="result.css?v=round-score-1">
  <script defer src="vendor/matter-0.20.0.min.js"></script>
  <script defer src="maps.js?v=formation-1"></script>
  <script defer src="physics.js?v=contact-chain-1"></script>
  <script defer src="motion.js?v=juzi-opening-2"></script>
  <script defer src="landing-water.js?v=entry-water-1"></script>
  <script defer src="landing-water-renderer.js?v=entry-water-1"></script>
  <script defer src="contact-feedback.js?v=contact-chain-1"></script>
  <script defer src="water-wake.js?v=water-wake-1"></script>
  <script defer src="water-wake-renderer.js?v=water-surface-1"></script>
  <script defer src="water-surface.js?v=water-loop-1"></script>
  <script defer src="water-surface-renderer.js?v=water-loop-1"></script>
  <script defer src="knockout-action.js?v=impact-live-1"></script>
  <script defer src="knockout-renderer.js?v=impact-live-1"></script>
  <script defer src="unseat-action.js?v=unseat-live-1"></script>
  <script defer src="unseat-momentum.js?v=aligned-flight-1"></script>
  <script defer src="unseat-renderer.js?v=contact-2"></script>
  <script defer src="impact-contact.js?v=impact-read-1"></script>
  <script defer src="impact-contact-renderer.js?v=impact-read-1"></script>
  <script defer src="impact-beat.js?v=unseat-pace-1"></script>
  <script defer src="knockout-camera.js?v=impact-read-1"></script>
  <script defer src="battle.js?v=early-round-1"></script>
  <script defer src="art.js?v=trio-default-1"></script>
  <script defer src="sound.js"></script>
  <script defer src="i18n.js"></script>
  <script defer src="game.js?v=player-traits-1"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><img id="title-art" src="assets/ui/concept-title-zh-v2.png" alt=""><h1 data-t="plugin.name"></h1></div>
      <label class="language"><span data-t="ui.language"></span><select id="language" aria-label="Language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ru">Русский</option><option value="es">Español</option><option value="pt">Português</option></select></label>
    </header>
    <div id="load-error" role="alert" hidden></div>
    <div class="workspace" id="workspace" hidden>
      <section class="pool-section">
        <div class="pool-heading scoreboard" id="scoreboard" data-mode="battle" data-aria="hud.scoreboard">
          <section class="team-panel" id="ally-panel" data-team="0">
            <div class="team-heading"><img src="assets/ui/icons/fa-solid/paw.svg" alt=""><strong data-t="hud.ally"></strong><span id="ally-actions" class="sr-only"></span></div>
            <div class="team-content"><div class="roster" id="ally-roster"></div><div class="team-score"><strong id="ally-score">0</strong><span class="score-target"></span></div></div>
          </section>
          <div class="match-summary">
            <span id="round-status" class="round-status"></span>
            <strong class="state-pill" id="state" aria-live="polite"></strong>
            <span id="target-status"></span><span id="first-status"></span>
          </div>
          <section class="team-panel" id="enemy-panel" data-team="1">
            <div class="team-heading"><img src="assets/ui/icons/fa-solid/paw.svg" alt=""><strong data-t="hud.enemy"></strong><span id="enemy-actions" class="sr-only"></span></div>
            <div class="team-content"><div class="roster" id="enemy-roster"></div><div class="team-score"><strong id="enemy-score">0</strong><span class="score-target"></span></div></div>
          </section>
          <span id="score-status" class="sr-only"></span><span id="team-status" class="sr-only"></span>
        </div>
        <div class="stage-slot">
          <div class="canvas-wrap">
            <canvas id="pool" width="960" height="600" tabindex="0" data-aria="ui.canvas"></canvas>
            <div id="round-score" class="round-score" hidden>
              <div class="round-score-title"><span id="round-score-number"></span><span data-t="battle.totalKnockouts"></span></div>
              <div class="round-score-line">
                <span class="round-score-team"><span data-t="hud.ally"></span><strong id="round-score-ally"></strong></span>
                <span aria-hidden="true">:</span>
                <span class="round-score-team"><strong id="round-score-rival"></strong><span data-t="hud.enemy"></span></span>
              </div>
            </div>
            <div class="pause-cover" id="pause-cover" hidden><span data-t="ui.paused"></span></div>
          </div>
        </div>
        <div class="pool-footer"><p id="play-hint" data-t="ui.hint"></p><p id="map-note" role="status" data-t="map.fallback" hidden></p></div>
      </section>
      <section class="controls" data-aria="ui.tuning">
        <div class="side-info">
          <section class="selection">
            <button type="button" id="show-art" class="selected-picture" data-aria="ui.expression"><canvas id="selected-portrait" width="48" height="48" aria-hidden="true"></canvas><span id="selected-fallback" hidden></span></button>
            <div class="selection-copy">
              <div class="selection-title"><span class="eyebrow" data-t="ui.selected"></span><h2 id="selected-name"></h2></div>
              <div class="selection-details">
                <div class="stat-chip health-stat" id="selected-health-wrap"><div class="stat-line"><img src="assets/ui/icons/fa-solid/heart.svg" alt=""><span id="selected-health"></span></div><progress id="selected-healthbar" max="120" value="120" aria-label="HP"></progress></div>
                <div class="stat-chip attack-stat" id="selected-attack-wrap"><img src="assets/ui/icons/swords.svg" alt=""><span id="selected-attack"></span></div>
                <span class="stat-chip skill-chip"><img src="assets/ui/icons/fa-solid/paw.svg" alt=""><span id="selected-skill"></span></span>
              </div>
              <span id="selected-stats" class="sr-only" aria-hidden="true"></span><span id="selected-turn" class="sr-only"></span>
            </div>
          </section>
          <p class="launch-tip"><img class="tip-hand" src="assets/ui/icons/fa-regular/hand-pointer.svg" alt=""><span id="launch-hint-copy" data-t="ui.launchHint" role="status"></span></p>
        </div>
        <div class="control-actions"><button id="sound-toggle" class="secondary" type="button" aria-pressed="true"><img id="sound-icon" src="assets/ui/icons/fa-solid/volume-high.svg" alt=""><span id="sound-label"></span></button><button id="show-tuning" type="button" class="secondary" data-aria="skin.settings"><img src="assets/ui/icons/fa-solid/gear.svg" alt=""><span data-t="skin.settings"></span></button><button id="reset" class="primary"><img src="assets/ui/icons/fa-solid/rotate-right.svg" alt=""><span id="reset-label" data-t="skin.restart"></span></button></div>
      </section>
    </div>
    <dialog id="art-dialog" aria-labelledby="art-title">
      <header class="dialog-heading"><h2 id="art-title" data-t="ui.artStudy"></h2><button type="button" data-close="art-dialog" data-t="ui.close"></button></header>
          <div id="character-card">
            <canvas id="character-preview" width="192" height="192" data-aria="ui.artStudy"></canvas>
            <p id="character-stats"></p><p id="skill-description" class="muted"></p>
            <!-- dev-character -->
          </div>
    </dialog>
    <dialog id="tuning-dialog" aria-labelledby="tuning-title">
      <header class="dialog-heading"><h2 id="tuning-title" data-t="skin.settings"></h2><button type="button" data-close="tuning-dialog" data-t="ui.close"></button></header>
        <div class="match-options">
        <section class="setup"><label for="game-mode" data-t="ui.mode"></label><select id="game-mode"><option value="battle" data-t="mode.battle"></option><option value="practice" data-t="mode.practice"></option></select></section>
        <section class="setup" id="layout-wrap"><label for="layout" data-t="ui.layout"></label><select id="layout" aria-describedby="layout-note"><option value="free" data-t="layout.free"></option><option value="wall" data-t="layout.wall"></option><option value="duel" data-t="layout.duel"></option><option value="chain" data-t="layout.chain"></option><option value="corner" data-t="layout.corner"></option></select><p id="layout-note" hidden></p></section>
        </div>
        <!-- dev-settings -->
    </dialog>
    <dialog id="restart-dialog" aria-labelledby="restart-title" aria-describedby="restart-note">
      <h2 id="restart-title" data-t="restart.title"></h2>
      <p id="restart-note" data-t="restart.note"></p>
      <button type="button" class="secondary" data-close="restart-dialog" data-t="restart.cancel" autofocus></button>
      <button type="button" id="confirm-restart" class="primary" data-t="skin.restart"></button>
    </dialog>
    <dialog id="result-dialog" aria-labelledby="result-title" aria-describedby="result-note">
      <div class="result-score-reveal" aria-hidden="true">
        <span class="result-score-ally"><strong id="result-reveal-ally"></strong></span>
        <span class="result-score-divider">:</span>
        <span class="result-score-rival"><strong id="result-reveal-rival"></strong></span>
      </div>
      <section class="result-stage">
        <div class="result-content">
          <header>
            <h2 id="result-title"></h2>
            <p id="result-note" class="result-score-line"></p>
            <p id="result-meta"></p>
          </header>
          <ul id="result-lineup" class="result-lineup" data-aria="result.lineup"></ul>
          <div class="result-actions">
            <button type="button" id="result-back" class="secondary" data-t="result.back"></button>
            <button type="button" id="play-again" class="primary" data-t="battle.restart"></button>
          </div>
        </div>
      </section>
    </dialog>
  </main>
  <canvas id="knockout-layer" aria-hidden="true"></canvas>
  <div id="versus-cue" class="versus-cue" aria-hidden="true" hidden>
    <div class="versus-ribbons">
      <div class="versus-ribbon versus-ribbon-ally"><strong id="versus-ally-name"></strong><span id="versus-ally-cats"></span></div>
      <div class="versus-ribbon versus-ribbon-rival"><span id="versus-rival-cats"></span><strong id="versus-rival-name"></strong></div>
      <span class="versus-burst"><b>VS</b></span>
    </div>
  </div>
</body>
</html>
