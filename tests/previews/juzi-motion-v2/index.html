<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><base href="/static/">
  <meta name="darkreader-lock"><meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>橘子 · 淘汰动作小样</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/tests/previews/juzi-motion-v2/style.css">
  <script defer src="motion.js?v=motion-choice-1"></script>
  <script defer src="art.js?v=juzi-ejection-1"></script>
  <script defer src="knockout-action.js?v=study-1"></script>
  <script defer src="/tests/previews/juzi-motion-v2/preview.js?v=1"></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">喵喵碰碰大作战 · 动作讨论</p><h1>橘子的淘汰动作小样</h1></div><span class="badge">粗姿态 · 未替换正式对局</span></header>
    <section class="toolbar" aria-label="预览设置">
      <label>版本<select id="version"><option value="candidate">新版 · 受击 → 脱圈 → 翻飞</option><option value="current">上一版 · 单姿态翻飞</option><option value="both">左右对比 · 同步播放</option></select></label>
      <label>速度<select id="speed"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select></label>
      <label>受击方向<select id="direction"><option value="right">向右</option><option value="left">向左</option><option value="up">向上</option><option value="down">向下</option></select></label>
      <label>位置<select id="origin"><option value="center">泳池中央</option><option value="top">靠近上沿</option><option value="bottom">靠近下沿</option></select></label>
      <label class="check"><input type="checkbox" id="loop" checked>循环</label>
    </section>
    <section class="stage" aria-label="橘子淘汰动画"><canvas id="study-canvas" aria-label="橘子与泳圈的淘汰动作"></canvas><p id="loading">正在载入橘子…</p><div class="stage-label" id="stage-label">新版 · 粗动作</div><div class="phase-tag" id="phase-tag" aria-live="off">准备受击</div></section>
    <section class="playback" aria-label="播放控制">
      <div class="buttons"><button id="replay">重播</button><button id="play">暂停</button><button id="previous">上一帧</button><button id="next">下一帧</button></div>
      <label class="scrubber">逐帧查看<input type="range" id="timeline" min="-0.3" max="1.45" value="-0.3" step="0.0166666667"></label><output id="time">准备</output>
    </section>
    <nav class="beats" aria-label="关键动作"><button data-time="0.028">① 受击缩起</button><button data-time="0.14">② 上身脱圈</button><button data-time="0.34">③ 收腿翻飞</button><button data-time="0.82">④ 离场</button></nav>
    <footer><p>先看动作是否连贯：身体被撞起，腿随后离圈，泳圈慢半拍。头顶小猫始终抓紧猫娘。这里不加水花、闪光或音效。</p><p class="quiet">当前明确播放完整动画，仅用于这张预览页；不会修改游戏或系统的动画偏好。可切到上一版或左右对比。</p><details><summary>检查状态</summary><pre id="check-status"></pre></details></footer>
  </main>
</body>
</html>
